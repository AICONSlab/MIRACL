name: "conv/reg test workflow"
description: "Running conversion and registration to test workflow"
version: "1.0"

vars:
  project: "literal:mapl3"
  base_dir: "ref:conv.tiff_folder"

modules:
  conversion@conv: {}
  conversion@convtest: {}
  registration@reg: {}

execution_order:
  - conv
  - convtest
  - reg

data_flow:
  conv: {}

  convtest:
    tiff_folder: "literal:This is a test"

  reg:
    tiff_folder: "ref:vars.base_dir"
    nii_folder: "pattern:signal_{ref:conv.channame}_{ref:conv.channum}.nii.gz"
