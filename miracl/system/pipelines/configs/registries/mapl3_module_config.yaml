_meta:
  title: "Mapping Axonal Projections in Light-sheet Fluorescence Microscopy in 3D (MAPL3)"
  module: flow
  command: mapl3
  help: |
    *---------------------------------------------------------------------------------*
    | Mapping Axonal Projections in Light-sheet Fluorescence Microscopy in 3D (MAPL3) |
    *---------------------------------------------------------------------------------*
    
    MAPL3 is an end-to-end deep learning pipeline for generalizable, brain-wide mapping 
    of structural connectivity at the single-axon level using tera-voxel light sheet 
    fluorescence microscopy (LSFM) dataset. It’s built for scalability, precision, and 
    biological insight and bridges the gap between raw LSFM data and interpretable 
    brain-wide connectivity maps.

    Features:
      - SPECTRE (Spatial Patch Encoding with Convolutional TransfoRmEr) Network: A novel
        deep learning design that fuses convolutional precision with transformer-level
        context awareness, capturing both fine axonal details and global anatomical structure.
      - Self-Supervised Generative Pretraining: Pretrained on ~22,000 3D sub-volumes using
        advanced self-supervised learning (SSL) and unique patch-based augmentation
        strategies. Enhances model robustness across diverse imaging conditions and
        experimental setups.
      - State-of-the-Art Performance: Extensively benchmarked against leading DL pipelines,
        MAPL3 consistently outperforms them in both in- and out-of-distribution datasets,
        from patch-level inference to full-brain reconstructions.
      - Neuroscientific Discovery at Scale: MAPL3 reveals cell-type-specific axonal
        connectivity patterns previously unresolved by existing methods, enabling new
        insights into mesoscale and quantitative brain circuitry analysis.
  extended_help: |
    This interface runs the following modules:
      - Tiff to Nifti conversion
      - CLARITY to Allen Atlas registration
      - Patch generation
      - Preprocessing
      - Inference
      - Patch stacking
      - Normalization
      - Voxelization
      - CLARITY Allen warping
      - Plotting
      - Feature extraction
  docs_url: "https://miracl.readthedocs.io/en/latest/tutorials/workflows/mapl3_flow/mapl3_flow.html"
  examples:
    - cmd: "miracl flow mapl3 -mwfc_ratf /data/raw_autoflor_tiffs -mwfc_rstf /data/raw_signal_tiffs -mwfc_cof /results"
      help: "Basic MAPL3 run with just the required flags"
    - cmd: "miracl flow mapl3 -mwfc_ratf /data/raw_autoflor_tiffs -mwfc_rstf /data/raw_signal_tiffs -mwfc_cof /results -mctn_d 15 -mrca_o LPI"
      help: "Using a custom downsample factor for conversion and a different orientation for registration"
  experimental: false
  deprecated: false
  deprecation_message: ""
