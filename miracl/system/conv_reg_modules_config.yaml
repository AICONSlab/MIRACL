_meta:
  module: flow
  command: conv_reg
  help: |
    Complete CLARITY-Allen registration pipeline that processes raw microscopy data to atlas-aligned brain volumes:  
  
      1) Converts TIFF image stacks to NIfTI format with intelligent downsampling  
      2) Registers CLARITY data to Allen Reference mouse brain atlas  
      3) Warps Allen annotations to original high-resolution CLARITY space  
      4) Optionally warps full-resolution CLARITY data to Allen atlas space  
        
    This workflow eliminates the need to run separate conversion and registration tools,  
    ensuring consistent processing and standardized outputs compatible with downstream  
    analysis pipelines. Ideal for multi-sample studies requiring atlas-based quantitative  
    analysis and cross-subject comparisons.
  extended_help: |
    Conversion Outputs:
      - {name}{downsample}x_down{channel}.nii.gz - Located in conv_final/ - Primary conversion output representing the downsampled NIfTI file from TIFF conversion miracl_conv_convertTIFFtoNII.py

    Registration Outputs:
      - clar_allen_space.nii.gz - Located in reg_final/ - Critical file containing CLARITY data warped to Allen reference space for cross-subject comparison miracl_workflow_registration_clarity-allen.sh
      - clar_downsample_res{vox}um.nii.gz - Located in reg_final/ - High importance file containing oriented downsampled CLARITY data for validation miracl_workflow_registration_clarity-allen.sh
      - annotation_hemi_{hemi}_{vox}um_clar_downsample.nii.gz - Located in reg_final/ - Critical file containing Allen labels in native CLARITY space for region-based analysis miracl_workflow_registration_clarity-allen.sh
    
    Full-Resolution Analysis Files:
      - annotation_hemi_{hemi}_{vox}um_clar.tif - Located in reg_final/ - High importance file containing Allen labels in original full-resolution CLARITY space miracl_reg_clar-allen.sh
      - annotation_hemi_{hemi}_{vox}um_clar_vox.tif - Located in reg_final/ - Medium importance file containing Allen labels in oriented CLARITY space (voxel format) miracl_workflow_registration_clarity-allen.sh

    Validation Files:
      - allen_labels_to_clar_mosaic.png - Located in reg_final/ - High importance file providing registration quality validation mosaic miracl_reg_clar-allen.sh

    Key Usage Notes:
      - For registration validation: Overlay annotation_hemi_{hemi}_{vox}um_clar_downsample.nii.gz on clar_downsample_res{vox}um.nii.gz ace_flow.rst
      - For cross-subject analysis: Use clar_allen_space.nii.gz in Allen atlas space
      - For high-resolution analysis: Use the .tif label files in original CLARITY space

    The workflow produces a complete pipeline from raw TIFF data to atlas-aligned volumes, with the most critical files being the converted NIfTI, the Allen-space registered data, and the warped annotation labels for quantitative analysis.

    Notes:
      - {vox} represents voxel resolution (10, 25, or 50 μm)
      - {hemi} indicates hemisphere configuration (combined or split)
      - {downsample} is the downsampling factor used during conversion
      - Use miracl reg check to visualize registration results interactively
  docs_url: "https://miracl.readthedocs.io/en/latest/tutorials/workflows/clarity_registration/clar_reg.html"
  examples:
    - cmd: "miracl flow conv_reg -i tiff_folder -o results_folder"
      help: "Basic conversion and registration"
  experimental: false
  deprecated: false
  deprecation_message: ""
  version: "2.0.0"
  requires_gpu: false
  min_memory_gb: "256GB"
  estimated_runtime: "2-4h"
  tags:
    - "registration"
    - "clarity"
    - "allen"
  test_data: "tests/data/flow/conv_reg"

mapl3_workflow_connectors:
  script: ""
  obj_class: "miracl.system.objs.objs_flow.objs_mapl3_workflow.objs_mapl3_workflow_connectors.Mapl3WorkflowConnectors"
  module_type: "MODULE"
  runner: "miracl.system.registry.runners.generic_runner.generic_runner"
  flag_map: {}
  execute: false

conversion:
  script: "python /code/miracl/conv/miracl_conv_convertTIFFtoNII.py"
  obj_class: "miracl.system.objs.objs_conv.objs_tiff_to_nii.objs_tiff_to_nii.ConvTiffNiiObjs"
  module_type: "FLOW_MAPL3"
  runner: "miracl.system.registry.runners.generic_runner.generic_runner"
  flag_map:
    "--mctn_folder": "--folder"
    "--mctn_work_dir": "--work_dir"
    "--mctn_down": "--down"
    "--mctn_channum": "--channum"
    "--mctn_chanprefix": "--chanprefix"
    "--mctn_channame": "--channame"
    "--mctn_outnii": "--outnii"
    "--mctn_resx": "--resx"
    "--mctn_resz": "--resz"
    "--mctn_center": "--center"
    "--mctn_downzdim": "--downzdim"
    "--mctn_prevdown": "--prevdown"
    "--mctn_percentile_thr": "--percentile_thr"
  execute: false

registration:
  script: "/code/miracl/reg/miracl_reg_clar-allen.sh"
  obj_class: "miracl.system.objs.objs_reg.objs_clar_allen.objs_clar_allen_reg.ClarAllen"
  module_type: "FLOW_MAPL3"
  runner: "miracl.system.registry.runners.generic_runner.generic_runner"
  flag_map:
    "--mrca_input": "-i"
    "--mrca_tiff_input": "-c"
    "--mrca_output": "-r"
    "--mrca_orient_code": "-o"
    "--mrca_voxel_size": "-v"
    "--mrca_hemi": "-m"
    "--mrca_allen_label": "-l"
    "--mrca_allen_atlas": "-a"
    "--mrca_side": "-s"
    "--mrca_no_mosaic_fig": "-f"
    "--mrca_olfactory_bulb": "-b"
    "--mrca_skip_cor": "-p"
    "--mrca_warp": "-w"
    "--mrca_chan_num": "-n"
    "--mrca_chan_prefix": "-x"
  execute: false

