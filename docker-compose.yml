version: "3.3"
services:
  miracl:
    image: sgc_miracl_img:latest
    tty: true
    environment:
      - DISPLAY
    stdin_open: true
    network_mode: host
    container_name: sgc_miracl
    shm_size: 866501mb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /home/sgablecook/.Xauthority:/home/sgablecook/.Xauthority
      - /home/sgablecook/git/MIRACL/miracl:/code/miracl
      - /home/sgablecook/git/MIRACL/tests:/code/tests
      - /data1/projects/sgablecook/dustin_data:/rat_data
