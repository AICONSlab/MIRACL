version: "3.3"
services:
  miracl:
    image: sgc_miracl_img:latest
    tty: true
    environment:
      - DISPLAY
    stdin_open: true
    network_mode: host
    container_name: sgc_miracl_img
    shm_size: 109216mb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /home/sgablecook/.Xauthority:/home/sgablecook/.Xauthority
      - /home/sgablecook/git/miracl/miracl:/code/miracl
      - /data1/projects/sgablecook/ACE/debug:/data
